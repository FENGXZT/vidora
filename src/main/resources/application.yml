spring:
  application:
    name: vidora-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

    # Hikari 连接池配置
    Hikari:
      # ========== 连接池大小 ==========
      maximum-pool-size: 50        # 最大连接数（核心参数）
      minimum-idle: 10             # 最小空闲连接（建议 = maximum-pool-size）

      # ========== 超时 ==========
      connection-timeout: 30000    # 获取连接超时（ms），默认 30s
      idle-timeout: 600000         # 空闲连接超时（ms），默认 10min
      max-lifetime: 1800000        # 连接最大存活（ms），默认 30min

  # 调度任务配置
  task:
    scheduling:
      pool:
        size: 10                    # 调度线程池大小
      thread-name-prefix: vidora-scheduling-   # 线程名前缀，便于排查
      shutdown:
        await-termination: true    # 关闭时等待任务完成
        await-termination-period: 30s   # 最长等待 30 秒

  data:
    # redis配置
    redis:
      host: ${SPRING_DATA_REDIS_HOST}       # redis地址
      port: ${SPRING_DATA_REDIS_PORT}            # redis端口
      # ★ 必须有这个 key：生产 Redis 一定设密码。
      #   缺了它不是启动失败，而是"启动成功 + 缓存静默全失效"——
      #   请求全部穿透 MySQL，接口照样 200，只在日志里留几行告警，极难发现。
      #   默认空值 = 本地无密码 Redis 不受影响（Spring Boot 空串视为未设置）。
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT}            # 命令超时
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT}    # 连接超时

  servlet:
    multipart:
      # ★ 与 UploadScene.VIDEO.maxSize（1GB）对齐：
      #   业务层是唯一权威上限，HTTP 层只留一点点余量给分片表单字段，
      #   否则超限文件会"先传完再被业务层拒"，白耗带宽和时间。
      max-file-size: 1GB        # 单个文件最大
      max-request-size: 1100MB  # 整个请求最大（文件 + 表单字段开销）
  # 服务器配置
  lifecycle:
    timeout-per-shutdown-phase: 30s

  config:
    import: optional:file:.env[.properties]

# mybatis配置
mybatis:
  configuration:
    map-underscore-to-camel-case: true
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 日志实现
  mapper-locations: classpath:mapper/*.xml

# JWT配置
jwt:
  secret:  ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}          # 令牌有效期

# MinIO配置
minio:
  endpoint: ${MINIO_ENDPOINT}
  publicEndpoint: ${MINIO_PUBLIC_ENDPOINT}
  accessKey: ${MINIO_ACCESS_KEY}
  secretKey: ${MINIO_SECRET_KEY}
  VideoBucketName: vidora-video
  ImageBucketName: vidora-image

# 管理端配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized   # 可选：详情只给授权用户看
      probes:
        enabled: true                 # 可选：暴露 liveness/readiness 探针

# 服务器配置
server:
  shutdown: graceful

# 日志配置
logging:
  file:
    name: logs/vidora.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 5GB

  level:
    root: INFO                              # 全局默认
    com.fxzt.vidora: INFO                 # 自己的代码
    com.fxzt.vidora.mapper: INFO           # MyBatis SQL 日志
    org.springframework: WARN               # Spring 只记警告
    org.apache.ibatis: DEBUG                # MyBatis 内部日志
    io.lettuce: WARN                        # Redis 客户端只记警告
    com.zaxxer.hikari: WARN