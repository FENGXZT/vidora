spring:
  application:
    name: vidora-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://localhost:3306/vidora?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    # redis配置
    redis:
      host: localhost       # redis地址
      port: 6379            # redis端口
      timeout: 2s            # 命令超时
      connect-timeout: 1s    # 连接超时

  servlet:
    multipart:
      max-file-size: 2GB        # 单个文件最大
      max-request-size: 3GB     # 整个请求最大（含多个文件）

  config:
    import: optional:file:.env[.properties]

#mybatis配置
mybatis:
  configuration:
    map-underscore-to-camel-case: true
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 日志实现
  mapper-locations: classpath:mapper/*.xml

#JWT配置
jwt:
  secret:  ${JWT_SECRET}
  expiration: 12h          # 令牌有效期

#MinIO配置
minio:
  endpoint: ${MINIO_ENDPOINT}
  accessKey: ${MINIO_ACCESS_KEY}
  secretKey: ${MINIO_SECRET_KEY}
  VideoBucketName: vidora-video
  ImageBucketName: vidora-image
